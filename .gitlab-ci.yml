# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:
  - test

# Run python tests
backend-tests:
  stage: test
  image: python:3.11
  script:
    - pip install pytest
    - pytest Code/tests/back_test.py

# Job for JavaScript Tests
frontend-tests:
  stage: test
  image: node:20
  before_script:
    # Install jsdom
    - npm init -y
    - npm install jsdom jsdom-global
  script:
    # Run the testing script with jsdom
    - node -r jsdom-global/register Code/tests/front_unittest.js
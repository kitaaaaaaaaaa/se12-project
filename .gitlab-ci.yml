# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# Include SAST scanning as instructed in the documentation:
# https://docs.gitlab.com/user/application_security/sast/
# And also include secret scanning (look for API keys and encryption keys) as instructed in:
# https://docs.gitlab.com/user/application_security/secret_detection/pipeline/
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Don't scan documentation for vulnerabilities or sensitive information
# Don't scan database or backend log files either
variables:
  SAST_EXCLUDED_PATHS: "Documentation, Code/backend/database, Code/backend/app.log"
  SECRET_DETECTION_EXCLUDED_PATHS: "Documentation, Code/backend/database, Code/backend/app.log"

stages:
  - test

# Automatically run testing files, made with the help of the article:
# https://medium.com/@morepravin1989/automatically-run-tests-using-github-actions-step-by-step-guide-for-beginners-with-example-51acdd6dd0ea
# Run python tests
backend-tests:
  stage: test
  image: python:3.11
  script:
    - pip install pytest
    - pytest Code/tests/back_test.py

# Job for JavaScript Tests
frontend-tests:
  stage: test
  image: node:20
  before_script:
    # Install jsdom
    - npm init -y
    - npm pkg set type="module"
    - npm install jsdom jsdom-global
  script:
    # Run the testing script with jsdom
    - node -r jsdom-global/register Code/tests/front_unittest.js
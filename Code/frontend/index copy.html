<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Run Sheet</title>

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Import icons -->
    <script src="https://kit.fontawesome.com/bb061b2ebb.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="flex-container">
        <span class="secondary-text-clr">Friday, 1 May 2026</span>
        <h1>Digital Run Sheet</h1>
        <button type="button" id="create-account">
            <i class="fa-regular fa-circle-user"></i>
            Create account
        </button>
    </header>
    <main>
        <section class="pill-container">
            <button type="button" class="pill active">
                All events
            </button>
            <button type="button" class="pill">
                Current events
            </button>
            <button type="button" class="pill">
                Future events
            </button>
        </section>
        
        <section class="events-container grid-container">
            <event-card
                event-name="2026 Concert"
                event-date="01/05/2026"
                event-location="School Hall"
                past=""
            ></event-card>

            <event-card
                event-name="2025 Concert"
                event-date="28/07/2025"
                event-location="School Hall"
                past="past"
            ></event-card>

        </section>


        <button type="button" class="floating-button" >
            <i class="fa-solid fa-plus"></i>
            Create new event
        </button>

        <section class="empty-screen hidden">
            <span class="figtree-semibold">(っ °Д °)っ</span>
            <p>Looks like there's nothing here...</p>
        </section>
    </main>
    <script src="app.js" defer></script>
</body>
</html>

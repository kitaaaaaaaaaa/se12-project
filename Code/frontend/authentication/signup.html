<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueSync</title>
    <link rel="shortcut icon" href="../assets/favicon.svg" type="image/x-icon">

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../components/style.css">
    
    <!-- Import icons -->
    <script src="https://kit.fontawesome.com/bb061b2ebb.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="flex-container">
        <span class="secondary-text-clr"></span>
        <h1>QueSync</h1>
        <a href="../index.html" class="button" id="signin-switch-button">
            <i class="fa-regular fa-circle-user"></i>
            Log into your account
        </a>
    </header>
    <main style="height: 85vh;">
        <!-- Code copied from LearnerHours PWA -->
        <section id="authentication-section">
            <form id="signup-form">
                <fieldset>
                    <legend>Sign up</legend>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" autocomplete="off" placeholder="example@mail.com">
                        <div id="email-error" class="error hidden"></div>
                    </div>

                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter a password">
                        <div id="password-error" class="error hidden"></div>
                    </div>

                    <div>
                        <label for="reenter-password">Reenter password:</label>
                        <input type="password" id="reenter-password" name="reenter-password" placeholder="Reenter your password ">
                        <div id="reenter-password-error" class="error hidden"></div>
                    </div>

                    <div>
                        <label for="role">Role:</label>
                        <select id="role" name="role">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div>
                        <a href="../index.html" class="link" tabindex="0">
                            Already have an account?
                        </a>
                    </div>

                    <div>
                        <button type="submit" id="signup-button">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            Sign up
                        </button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
    <script type="module" src="../components/app.js" defer></script>
    <script type="module" src="signup.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Run Sheet</title>

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="components/style.css">
    
    <!-- Import icons -->
    <script src="https://kit.fontawesome.com/bb061b2ebb.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="flex-container">
        <span class="secondary-text-clr"></span>
        <h1>Digital Run Sheet</h1>
        <a href="authentication/signup.html" class="button" id="signup-switch-button">
            <i class="fa-solid fa-user-plus"></i>
            Don't have an account?
        </a>
    </header>
    <main style="height: 85vh;">
        <!-- Code copied from LearnerHours PWA -->
        <section id="authentication-section">
            <form id="signin-form">
                <fieldset>
                    <legend>Sign in</legend>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                        <div id="email-error" class="error"></div>
                    </div>

                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password">
                        <div id="password-error" class="error"></div>
                    </div>

                    <div>
                        <a href="authentication/signup.html" class="link">
                            Don't have an account?
                        </a>
                    </div>

                    <div>
                        <button type="submit" id="signin-button">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            Sign in
                        </button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
    <script type="module" src="components/app.js" defer></script>
    <script type="module" src="index.js" defer></script>
</body>
</html>

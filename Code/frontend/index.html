<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueSync</title>
    <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-icon">

    <link rel="stylesheet" href="./components/style.css">
    
    <!-- Import icons -->
    <script defer src="./libs/fontawesome.min.js"></script>
    <script defer src="./libs/regular.min.js"></script>
    <script defer src="./libs/solid.min.js"></script>
</head>
<body>
    <header class="flex-container">
        <span class="secondary-text-clr"></span>
        <h1>QueSync</h1>
        <a href="authentication/signup.html" class="button" id="signup-switch-button">
            <i class="fa-solid fa-user-plus"></i>
            Create an account
        </a>
    </header>
    <main style="height: 85vh;">
        <!-- Code adapted from LearnerHours PWA -->
        <section id="authentication-section">
            <form id="signin-form">
                <fieldset>
                    <legend>Sign in</legend>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com">
                        <div id="email-error" class="error hidden"></div>
                    </div>

                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                        <div id="password-error" class="error hidden"></div>
                    </div>

                    <div>
                        <a href="authentication/signup.html" class="link" tabindex="0">
                            Don't have an account?
                        </a>
                    </div>

                    <div>
                        <button type="submit" id="signin-button">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            Sign in
                        </button>
                    </div>
                </fieldset>
            </form>
        </section>

        <span id="connection-display">🟡 Connecting...</span>
    </main>
    <script src="libs/purify.min.js" defer></script>
    <script type="module" src="components/app.js" defer></script>
    <script type="module" src="index.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Run Sheet</title>

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Import icons -->
    <script src="https://kit.fontawesome.com/bb061b2ebb.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="flex-container">
        <span class="secondary-text-clr">DDDD, DD MMMM YYYY</span>
        <h1>Digital Run Sheet</h1>
        <button type="button" id="create-account">
            <i class="fa-regular fa-circle-user"></i>
            Create account
        </button>
    </header>
    <main>
        <!-- Code copied from LearnerHours PWA -->
        <form id="registrationForm">
            <fieldset>
                <legend>Create an account</legend>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" class="figtree-400">
                <div id="usernameError" class="error"></div>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" class="figtree-400">
                <div id="passwordError" class="error"></div>

                <label for="reenter-password">Reenter Password:</label>
                <input type="password" id="reenter-password" name="password" class="figtree-400">
                <div id="reenterPasswordError" class="error"></div>

                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" class="figtree-400">
                <div id="phoneError" class="error"></div>

                <div id="formError" class="error"></div>
                <button type="submit">Register</button>
            </fieldset>
        </form>
    </main>
    <script type="module" src="components/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Run Sheet</title>

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Import icons -->
    <script src="https://kit.fontawesome.com/bb061b2ebb.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="flex-container">
        <span class="secondary-text-clr">Friday, 1 May 2026</span>
        <h1>Digital Run Sheet</h1>
        <button type="button" id="create-account">
            <i class="fa-regular fa-circle-user"></i>
            Create account
        </button>
    </header>
    <main>
        <button type="button" command="show-modal" commandfor="my-dialog" class="blue-button">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            Open dialog
        </button>

        <dialog id="my-dialog">
            <h2>Are you sure?</h2>
            <p>Do you want to delete '2025 Concert'?</p>

            <div class="dialog-buttons">
                <button type="button" command="close" commandfor="my-dialog">
                    <i class="fa-solid fa-plus"></i>
                    Back
                </button>

                <button type="button" command="close" commandfor="my-dialog">
                    <i class="fa-solid fa-plus"></i>
                    Delete
                </button>
            </div>
        </dialog>

        <step-card
            step-title = "Erase Me by Lizzy McAlpine"
            step-performer = "Vocal Ensemble"
            step-number = "02"
            classes = "current-step admin"
            >
            <template>
                {
                    "instructions": [
                        {"job": "Stage Hands", "detail": "REMOVE all music stands"},
                        {"job": "Stage Hands", "detail": "HANDOFF 8 radio mics to vocalists"}
                    ]
                }
            </template>
        </step-card>

        <edit-step-card
            step-title = "Erase Me by Lizzy McAlpine"
            step-performer = "Vocal Ensemble"
            step-number = "02"
            curtains = "active"
            video = ""
            blackout = ""
            >
            <template>
                {
                    "instructions": [
                        {"job": "Stage Hands", "command": "REMOVE", "detail": "all music stands"},
                        {"job": "Stage Hands", "command": "HANDOFF", "detail": "8 radio mics to vocalists"}
                    ]
                }
            </template>
        </edit-step-card>


        <div class="step-card edit">
            <div class="step-header flex-container">
                    <span class="step-number figtree-semibold">00</span>
                    <div class="step-details flex-container">
                        <input type="text" placeholder="Step title">
                        
                        <div class="secondary-text-clr step-performer">
                            <label for="performer" class="flex-container">
                                <i class="fa-regular fa-star"></i>
                                On stage: 
                                <input type="text" name="performer" placeholder="Performer">
                            </label>
                        </div>
                    </div>
                
                <div class="rearrange-container flex-container">
                    <button type="button">
                        <i class="fa-solid fa-angle-up"></i>
                    </button>
                    <button>
                        <i class="fa-solid fa-angle-down"></i>
                    </button>
                </div>
            </div>

            <div class="edit-pills flex-container">
                <button type="button" class="pill">Curtains open?</button>
                <button type="button" class="pill">Video</button>
                <button type="button" class="pill">Blackout</button>
            </div>

            <!-- Generate a new one for each instruction -->
            <div class="instruction flex-container">
                <div>
                    <i class="fa-regular fa-user"></i>
                    <select name="instruction-job">
                        <option value="stage_hands">Stage Hands</option>
                        <option value="visuals">Visuals</option>
                        <option value="sound">Sound</option>
                        <option value="camera">Camera</option>
                        <option value="lighting">Lighting</option>
                    </select>
                </div>

                <div class="flex-container instruction-detail">
                    <div>
                        <select name="instruction-detail-command">
                            <option value="">HANDOFF</option>
                            <option value="">PLACE</option>
                            <option value="">REMOVE</option>
                            <option value="">MOVE</option>
                        </select>
                    </div>
                    <div class="instruction-text-input flex-container">
                        <input type="text" name="instruction-detail-text" placeholder="Instruction details">
                    </div>
                </div>
            </div>
            
            <button type="button" class="new-instruction">
                <i class="fa-solid fa-plus"></i>
                New instruction
            </button>
        </div>
        
        <button type="button" class="new-step">
            <i class="fa-solid fa-layer-group"></i>
            New step
        </button>


    </main>
    <script src="app.js" defer></script>
</body>
</html>
